pipeline:
  allowStageExecutions: false
  projectIdentifier: CreateDelegates
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: CG-Delegate-install
        identifier: CGDelegateinstall
        description: ""
        type: Deployment
        spec:
          serviceConfig:
            serviceRef: delagte
            serviceDefinition:
              type: Kubernetes
              spec:
                variables: []
          infrastructure:
            environmentRef: qa
            infrastructureDefinition:
              type: KubernetesDirect
              spec:
                connectorRef: delplayprivate
                namespace: harness-delegate-do-not-touch
                releaseName: release-<+INFRA_KEY>
            allowSimultaneousDeployments: true
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: install-delegate
                  identifier: installdelegate
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -x

                          # if which jq; then
                          #   echo found jq
                          #   echo
                          # else
                          #   echo installing jq
                          #   echo
                          #   apt-get install -y jq
                          # fi


                          delname="k8-qa-install-automation"
                          accountid="PtJUvcqdQz20phFsSN1iVA"
                          auth="ZGVsZWdhdGVfbmdAbWFpbGluYXRvci5jb206WkdWc1pXZGhkR1ZmYm1kQWJXRnBiR2x1"  

                          token=`curl https://qa.harness.io/gateway/api/users/login?accountId=$accountid -H 'Content-Type: application/json' --data-binary '{"authorization":"'"Basic $auth"'"}' | jq -r '.resource.token'` 

                          echo $token

                          curl "https://qa.harness.io/gateway/api/setup/delegates/downloadUrl?accountId=$accountid" -H 'authority: qa.harness.io' -H 'accept: application/json' -H "authorization: Bearer $token" > response.json

                          kubernetesUrl=`cat response.json |jq -r '.resource.kubernetesUrl'`

                          echo $kubernetesUrl
                            

                          curl -o harness-delegate-kubernetes.tar.gz "${kubernetesUrl}&delegateName=$delname"

                          tar -xvf harness-delegate-kubernetes.tar.gz

                          cd harness-delegate-kubernetes
                          cat harness-delegate.yaml

                          sed -i '69 s/1/0.5/' harness-delegate.yaml
                          sed -i '70 s/4Gi/1.5Gi/' harness-delegate.yaml
                          sed -i '87 s/2/10/' harness-delegate.yaml

                          cat harness-delegate.yaml

                          kubectl apply -f harness-delegate.yaml

                          cd ..
                          rm -rf harness-delegate-kubernetes.tar.gz
                          rm -rf harness-delegate-kubernetes

                          sleep 3m
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - quality-assurance-del-private
                  timeout: 20m
                  failureStrategies: []
                  when:
                    stageStatus: All
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: All
          condition: "false"
        variables: []
    - stage:
        name: CG-Profile-Del-Install
        identifier: CGProfileDelInstall
        description: ""
        type: Deployment
        spec:
          serviceConfig:
            serviceRef: delagte
            serviceDefinition:
              spec:
                variables: []
              type: Kubernetes
          infrastructure:
            environmentRef: qa
            infrastructureDefinition:
              type: KubernetesDirect
              spec:
                connectorRef: delplayprivate
                namespace: harness-delegate-do-not-touch
                releaseName: release-<+INFRA_KEY>
            allowSimultaneousDeployments: false
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Run delegate install
                  identifier: Run_delegate_install
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -x

                          # if which jq; then
                          #   echo found jq
                          #   echo
                          # else
                          #   echo installing jq
                          #   echo
                          #   apt-get install -y jq
                          # fi

                          delname="approved-delegate"
                          accountid="PtJUvcqdQz20phFsSN1iVA"
                          auth="ZGVsZWdhdGVfbmdAbWFpbGluYXRvci5jb206WkdWc1pXZGhkR1ZmYm1kQWJXRnBiR2x1"
                          delegateProfileId="sFNJRXCWTG-2piogJGg4Qw"  


                          token=`curl https://qa.harness.io/gateway/api/users/login?accountId=$accountid -H 'Content-Type: application/json' --data-binary '{"authorization":"'"Basic $auth"'"}' | jq -r '.resource.token'` 

                          echo $token

                          curl "https://qa.harness.io/gateway/api/setup/delegates/downloadUrl?accountId=$accountid" -H 'authority: qa.harness.io' -H 'accept: application/json' -H "authorization: Bearer $token" > response.json

                          kubernetesUrl=`cat response.json |jq -r '.resource.kubernetesUrl'`

                          echo $kubernetesUrl

                          curl -o harness-delegate-kubernetes.tar.gz "${kubernetesUrl}&delegateName=$delname&delegateProfileId=$delegateProfileId"

                          tar -xvf harness-delegate-kubernetes.tar.gz

                          cd harness-delegate-kubernetes
                          sed -i '69 s/1/0.5/' harness-delegate.yaml
                          sed -i '70 s/4Gi/1.5Gi/' harness-delegate.yaml
                          sed -i '87 s/2/10/' harness-delegate.yaml

                          cat harness-delegate.yaml

                          kubectl apply -f harness-delegate.yaml

                          cd ..
                          rm -rf harness-delegate-kubernetes.tar.gz
                          rm -rf harness-delegate-kubernetes


                          sleep 3m
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - quality-assurance-del-private
                  timeout: 20m
                  failureStrategies: []
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
          serviceDependencies: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: All
          condition: "false"
    - stage:
        name: NG-Delegate-install
        identifier: NGDelegateinstall
        description: ""
        type: Deployment
        spec:
          serviceConfig:
            serviceRef: service
            serviceDefinition:
              type: Kubernetes
              spec:
                variables: []
          infrastructure:
            environmentRef: QA
            infrastructureDefinition:
              type: KubernetesDirect
              spec:
                connectorRef: Automationcluster
                namespace: harness-delegate
                releaseName: release-<+INFRA_KEY>
            allowSimultaneousDeployments: true
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: install-delegate
                  identifier: installdelegate
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -x

                          if which jq; then
                            echo found jq
                            echo
                          else
                            echo installing jq
                            echo
                            apt-get install -y jq
                          fi
                          sleep 10s

                          delname="start1"
                          accountid="e9qDvR_0RYWXRvbJHZCyCg" #<+pipeline.variables.accountid>
                          auth=$(echo -n 'aditya.kashyap@harness.io:Aditya$2401' | base64)
                          identifier="k8sautomation"
                          namespace="harness-delegate"


                          token=`curl https://qa.harness.io/gateway/api/users/login?accountId=$accountid -H 'Content-Type: application/json' --data-binary '{"authorization": "'"Basic $auth"'"}' | jq -r '.resource.token'` 

                          echo $token
                          sleep 30
                          curl --location --request POST "https://qa.harness.io/gateway/api/setup/delegates/generate-kubernetes-yaml?routingId=$accountid&accountId=$accountid&fileFormat=text%2Fplain" \
                          --header 'authority: qa.harness.io' \
                          --header "authorization: Bearer $token" \
                          --header 'content-type: application/json' \
                          --data-raw '{"orgIdentifier":null,"projectIdentifier":null,"name":"'$delname'","description":"","size":"LAPTOP","delegateConfigurationId":null,"identifier":"'$identifier'","k8sConfigDetails":{"k8sPermissionType":"NAMESPACE_ADMIN","namespace":"'$namespace'"},"tags":null,"delegateType":"KUBERNETES","tokenName":"default_token"}' \
                          --compressed > harness-acct-delegate.yaml
                          cat harness-acct-delegate.yaml

                          sed -i '87 s/2048Mi/1536Mi/' harness-acct-delegate.yaml
                          sed -i '90 s/2048Mi/1536Mi/' harness-acct-delegate.yaml

                          sed -i '0,/containers:/s/      containers:/      imagePullSecrets:\n&/' harness-acct-delegate.yaml
                          sed -i "/imagePullSecrets:/a  \      - name: installimmutable" harness-acct-delegate.yaml

                          cat harness-acct-delegate.yaml

                          kubectl apply -f harness-acct-delegate.yaml

                          rm -rf harness-acct-delegate.yaml

                          sleep 5m
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - pl-play
                  timeout: 20m
                  failureStrategies: []
                  when:
                    stageStatus: All
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec: {}
          serviceDependencies: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        when:
          pipelineStatus: All
        delegateSelectors:
          - pl-play
    - stage:
        name: NG-Immutable-Delegate-Install
        identifier: Immutable_Delegate_Install
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: delegate
          environment:
            environmentRef: qa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: qaimmutable
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: install-immutable-delegate
                  identifier: installimmutabledelegate
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -x

                          # if which jq; then
                          #   echo found jq
                          #   echo
                          # else
                          #   echo installing jq
                          #   echo
                          #   apt-get install -y jq
                          # fi


                          delname="k8-immutable-install-automation"
                          accountid="LkTOnK9wRlaZHwbhVsRZZg"
                          auth="YXV0b3FhaW1tdXRhYmxlQG1haWxpbmF0b3IuY29tOkhhcm5lc3NAMTIz"
                          initial="lktnkw"
                          identifier="_k8_immutable_install_automation"
                          namespace="harness-delegate"

                          token=`curl https://qa.harness.io/gateway/api/users/login?accountId=$accountid -H 'Content-Type: application/json' --data-binary '{"authorization": "'"Basic $auth"'"}' | jq -r '.resource.token'` 

                          echo $token

                          curl --location --request POST "https://qa.harness.io/gateway/api/setup/delegates/generate-kubernetes-yaml?routingId=$accountid&accountId=$accountid&fileFormat=text%2Fplain" \
                          --header 'authority: qa.harness.io' \
                          --header "authorization: Bearer $token" \
                          --header 'content-type: application/json' \
                          --data-raw '{"orgIdentifier":null,"projectIdentifier":null,"name":"'$delname'","description":"","size":"LAPTOP","hostName":null,"delegateConfigurationId":null,"identifier":"'$identifier'","k8sConfigDetails":{"k8sPermissionType":"NAMESPACE_ADMIN","namespace":"'$namespace'"},"tags":null,"delegateType":"KUBERNETES","tokenName":"default_token","runAsRoot":true}' \
                          --compressed > harness-acct-delegate-imm.yaml


                          sleep 30s
                          ls -ll
                          sed -i '87 s/2048Mi/1536Mi/' harness-acct-delegate-imm.yaml
                          sed -i '90 s/2048Mi/1536Mi/' harness-acct-delegate-imm.yaml

                          #sed -i 's#harness/delegate-test#us.gcr.io/gcr-play/delegate#' harness-acct-delegate.yaml

                          sed -i '0,/containers:/s/      containers:/      imagePullSecrets:\n&/' harness-acct-delegate-imm.yaml
                          sed -i "/imagePullSecrets:/a  \      - name: installimmutable" harness-acct-delegate-imm.yaml
                          #sed -i -E "/containers/{n;s~(- image: ).*~\1$imageTag~}" harness-acct-delegate.yaml
                          #sed -i 's/^(\s*)(image\s*:\s*nginx\s*$)/\1image: apache/' 
                          #sed -i 's/image:.*/xyz/' harness-acct-delegate.yaml

                          cat harness-acct-delegate-imm.yaml

                          kubectl apply -f harness-acct-delegate-imm.yaml

                          rm -rf harness-acct-delegate-imm.yaml

                          sleep 5m
                    environmentVariables: []
                    outputVariables: []
                    delegateSelectors:
                      - quality-assurance-del-private
                  timeout: 10m
                  failureStrategies: []
            rollbackSteps: []
        tags: {}
        when:
          pipelineStatus: All
          condition: "false"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  variables:
    - name: environment
      type: String
      value: QA
  identifier: CreateDelegate
  name: CreateDelegate
